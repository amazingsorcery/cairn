name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Stops Corepack's download prompt from hanging the runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# Actions are pinned to major tags. To pin to SHAs instead:
#   gh api repos/actions/checkout/git/refs/tags/v4 --jq .object.sha
# and use `actions/checkout@<sha> # v4`.

jobs:
  # =====================================================================================
  # App + database checks. One job so install and build aren't repeated; steps fail fast.
  # =====================================================================================
  verify:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Same image as production. No PostGIS: nothing uses spatial queries. Keep in sync
        # with docker-compose.prod.yml.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        # Wait for initdb so the first migration doesn't race it.
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test


      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"

      # Dummy values so env validation passes. Real OAuth/SMTP are not exercised in CI.
      AUTH_GITHUB_ID: ci-not-a-real-client-id
      AUTH_GITHUB_SECRET: ci-not-a-real-client-secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM: ci@example.invalid
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node, whose pnpm cache calls `pnpm store path`.
      # Version comes from package.json's packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate an ephemeral AUTH_SECRET
        # Per-run so no secret-looking value is committed.
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Coverage thresholds in vitest.config.ts guard the workspace access-control code.
      # DB-backed suites use their own `app_test_vitest` database and fail (not skip) if
      # Postgres is unreachable.
      - name: Unit tests, with coverage thresholds
        run: pnpm test:coverage

      # Catches duplicate slugs, playbook steps citing missing tools, and step-order gaps.
      - name: Validate seed content
        run: pnpm content:check

      # The CSP img-src allowlist is generated from content/cameras/ and config/live.ts;
      # drift would block embeds in production (dev has no CSP).
      - name: Check the generated CSP matches the content
        run: pnpm csp:check

      # High/critical only. The known moderate (esbuild dev-server) is not in the
      # production image.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # Before build, since static generation may read the database.
      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # Chromium only, to keep CI fast.
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # =====================================================================================
  # Check the Dockerfile still builds (in-container install, standalone output, layout).
  # Runs in parallel with `verify`.
  # =====================================================================================
  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # No registry; the VPS builds from source in deploy.sh.
          push: false
          load: false
          tags: app-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        # Separate target that keeps devDependencies (tsx).
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          load: false
          tags: app-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================================
  # Static validation of the infrastructure files.
  # =====================================================================================
  infra:
    name: shell + compose + caddy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        # -S warning skips style-only suggestions.
        run: shellcheck -S warning infra/*.sh

      - name: Validate docker-compose.prod.yml
        # `compose config` needs a .env for substitution; the example's placeholders suffice.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          rm -f .env

      - name: Assert the production topology
        # Asserts:
        #   1. Services are exactly caddy, db, web (plus profile-gated migrate).
        #   2. Only caddy publishes ports (Docker's iptables rules bypass UFW).
        #   3. db is not on the internet-facing `edge` network.
        # `config --format json` needs Compose v2.20+.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --format json > /tmp/compose.json
          rm -f .env

          echo "Services:"; jq -r '.services | keys | .[]' /tmp/compose.json

          # Filter out `migrate`: whether profile-gated services are rendered depends on
          # the Compose version.
          jq -e '([.services | keys[] | select(. != "migrate")] | sort) == ["caddy","db","web"]' \
            /tmp/compose.json > /dev/null \
            || { echo "FAIL: expected exactly caddy, db, web (plus the profile-gated migrate)"; exit 1; }
          echo "OK: three long-running services, exactly as expected"

          published=$(jq -r '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] | sort | join(",")' /tmp/compose.json)
          if [ "$published" != "caddy" ]; then
            echo "FAIL: only caddy may publish ports; these do: $published"
            exit 1
          fi
          echo "OK: caddy is the only service publishing ports"

          on_edge=$(jq -r '[.services | to_entries[] | select(.value.networks | has("edge")) | .key] | sort | join(",")' /tmp/compose.json)
          if [ "$on_edge" != "caddy,web" ]; then
            echo "FAIL: edge must contain exactly caddy and web; it contains: $on_edge"
            exit 1
          fi
          echo "OK: db is off the edge network"

          # Every depends_on must name a defined service, or `up` fails at deploy time.
          jq -e '
            (.services | keys) as $defined
            | [.services | to_entries[]
               | .key as $svc
               | ((.value.depends_on // {}) | keys[])
               | select(. as $d | $defined | index($d) | not)]
              | length == 0
          ' /tmp/compose.json > /dev/null \
            || { echo "FAIL: a service depends_on something that is not defined in this file"; exit 1; }
          echo "OK: every depends_on names a service that exists"

      - name: Validate the Caddyfile
        # The Caddyfile reads DOMAIN/ACME_* at load time; dummy values are enough.
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.invalid \
            -e ACME_EMAIL=ci@example.invalid \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "${{ github.workspace }}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "${{ github.workspace }}/infra/csp.caddy:/etc/caddy/csp.caddy:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
