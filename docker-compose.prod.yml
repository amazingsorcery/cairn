# Production stack for a single Ubuntu LTS VPS.
#
#   caddy   -> the only service with published ports. Terminates TLS, sets security headers.
#   web     -> Next.js standalone server. No published port; reachable only as web:3000.
#   db      -> PostgreSQL 16 on a named volume, on an egress-less internal network.
#   migrate -> one-shot, profile-gated. Never runs as part of `up`.
#
# Declared limits total ~4.25 GB (db 2 GB, web 2 GB, caddy 256 MB). Not yet measured on a
# real box; 8 GB gives comfortable headroom.
#
# Usage (normally via infra/deploy.sh, which adds backup and rollback):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
#
# No PostGIS: nothing issues spatial queries. If it's ever needed, the postgis image runs
# CREATE EXTENSION on first boot, so prefer creating it in a migration.
#
# `${VAR}` is substituted by the compose CLI from `.env`; `env_file:` injects variables into
# the container. Both read the same file. `${VAR:?msg}` refuses to start on a missing value
# (an empty POSTGRES_PASSWORD would otherwise create a trust-auth database).

name: ${COMPOSE_PROJECT_NAME:-app}

# ---------------------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------------------

# Log rotation for every service; the default json-file driver is unbounded and a
# crash-looping container can fill the disk. Worst case 10 MB x 3 x 4 services = 120 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true

services:
  # -------------------------------------------------------------------------------------
  # db
  # -------------------------------------------------------------------------------------
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening

    # No cap_drop: the entrypoint needs CHOWN/SETUID/SETGID/FOWNER/DAC_OVERRIDE to fix
    # PGDATA ownership and drop privileges; dropping ALL breaks first-boot initdb.

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # scram-sha-256 rather than the image default md5 for any host connection.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}

    # Tuned for a 2 GB container:
    #   shared_buffers 512MB        ~25% of the limit.
    #   effective_cache_size 1536MB planner hint only.
    #   work_mem 8MB                per sort/hash node; keeps the worst case inside the limit.
    #   maintenance_work_mem 128MB  VACUUM, CREATE INDEX, pg_restore.
    #   max_connections 60          web pool (default 10) + migrate + pg_dump, with headroom.
    #   max_parallel_workers_per_gather 0
    #                               parallel query multiplies work_mem; no gain at this size.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=off

    volumes:
      - db_data:/var/lib/postgresql/data

    # Docker's 64 MB default causes "could not resize shared memory segment" under load.
    shm_size: 512mb

    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0

    # pg_isready rather than a TCP probe, which passes before initdb finishes.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

    networks:
      - backend

  # -------------------------------------------------------------------------------------
  # web
  # -------------------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${IMAGE_NAME:-app-web}:${IMAGE_TAG:-current}
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_drop:
      - ALL

    # Signal handling and zombie reaping for server.js.
    init: true

    # Not `ports:`: publishing would bypass Caddy, and Docker's iptables rules bypass UFW.
    expose:
      - "3000"

    env_file:
      - .env

    depends_on:
      db:
        # The app queries within a second of boot.
        condition: service_healthy

    # Duplicates the Dockerfile HEALTHCHECK so it's tunable without a rebuild.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    # Includes the in-process source cache (a few hundred KB per viewport). Least
    # predictable container; raise this first. Not yet measured in production.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0

    networks:
      - backend # to reach db
      # Caddy -> web, and web's outbound route (SMTP, OAuth, connectors).
      - edge

  # -------------------------------------------------------------------------------------
  # caddy
  # -------------------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_drop:
      - ALL
    cap_add:
      # Binding 80/443 inside the container. Nothing else is needed.
      - NET_BIND_SERVICE

    ports:
      - "80:80" # ACME HTTP-01 challenge + the redirect to HTTPS
      - "443:443" # TLS
      - "443:443/udp" # HTTP/3. Harmless if the client never uses it.

    environment:
      # Read by the Caddyfile as {$DOMAIN} / {$ACME_EMAIL}.
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      # Use the staging directory while testing (production: 5 failures/hostname/hour).
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      TZ: ${TZ:-UTC}

    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Imported by the Caddyfile (relative path); Caddy won't load without it.
      - ./infra/csp.caddy:/etc/caddy/csp.caddy:ro
      # Certificates and ACME account key. Must persist, or redeploys hit LE rate limits.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      # service_started, not healthy: Caddy should still get certs and serve a 502 if web
      # is broken.
      - web

    # Generous on purpose; an OOM-killed proxy takes TLS down with it.
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5

    networks:
      - edge

  # -------------------------------------------------------------------------------------
  # migrate -- one-shot
  # -------------------------------------------------------------------------------------
  # Profile-gated so `up` never starts it:
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate pnpm db:seed
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: ${IMAGE_NAME:-app-web}-migrate:${IMAGE_TAG:-current}
    restart: "no"
    logging: *default-logging
    <<: *default-hardening
    init: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - backend

volumes:
  db_data:
    # Named volume (bind mounts cause ownership issues). Back up with pg_dump
    # (infra/backup.sh), not by copying this directory.
  caddy_data:
  caddy_config:

# ---------------------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------------------
# `backend` is internal (no gateway), so containers also on `edge` route out through it:
# web has internet access, db has none.
networks:
  # Public via caddy's ports; also web's outbound route.
  edge:
    driver: bridge

  # No route in or out. db is only on this network.
  backend:
    driver: bridge
    internal: true
