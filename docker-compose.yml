# Local development stack.
#
# This file deliberately does NOT run the Next.js app by default. It provides the three
# things that are painful to run natively — Postgres 16, Redis and an SMTP sink — and you
# run the app on the host with `pnpm dev`.
#
# Why not containerise the dev server too: bind-mounting a repo into a Linux container
# from macOS or Windows makes the Next.js file watcher an order of magnitude slower, and
# node_modules built for the host OS collides with node_modules built for the container.
# The standard workarounds (anonymous volume over node_modules, polling watchers) are a
# steady drip of confusing failures. Running the app on the host is the boring choice and
# it is the same choice the CI workflow makes.
#
# Quick start:
#   cp .env.example .env      # then fill in the values it tells you to
#   docker compose up -d      # starts db + redis + mailpit
#   pnpm db:migrate && pnpm db:seed
#   pnpm dev                  # http://localhost:3000
#   open http://localhost:8025  # Mailpit: every magic-link email lands here
#
# THE WORKER IS NOT IN THIS FILE, and that is deliberate. In development you run the poller
# on the host the same way you run the app on the host — `pnpm worker` in a second terminal,
# against the same `.env` — for exactly the reasons in the paragraph above: a bind-mounted
# repo makes the watcher slow and the container's node_modules collide with the host's. The
# production worker container is in docker-compose.prod.yml and is built, not mounted.
#
# `docker compose --profile prodtest up -d --build web-prod` still only starts `web`. To
# smoke-test the worker image locally, build it explicitly:
#   docker build --target worker -t app-worker:localtest .
#
# To smoke-test the *production* image locally before deploying:
#   docker compose --profile prodtest up -d --build web-prod
#   curl -fsS http://localhost:3000/api/health

name: ${COMPOSE_PROJECT_NAME:-app}-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      TZ: ${TZ:-UTC}
    ports:
      # Published in dev only, so `pnpm dev`, Drizzle Studio and psql on the host can
      # reach it. Bound to 127.0.0.1 explicitly — a bare "5432:5432" would expose the
      # development database to your entire local network, and on a laptop on a coffee
      # shop wifi that is a real exposure.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER:-app}\" -d \"$${POSTGRES_DB:-app}\" -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    # v2 (ADR 0019). Development gets the same server as production with the same cache-only
    # configuration, because the two behaviours that bite are both configuration: eviction
    # under `allkeys-lru`, and keys vanishing across a restart because nothing is persisted.
    # A developer whose local Redis quietly keeps everything forever will not reproduce
    # either, and both are load-bearing in ADR 0022's claim that the map keeps no history.
    #
    # `maxmemory` is deliberately much smaller here than the 512 MB in production: a laptop
    # cache that is allowed to grow to half a gigabyte is one that never evicts, which is
    # exactly the case that then only shows up on the server.
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # Published on loopback only, so `pnpm dev`, `redis-cli` and the tests on the host can
      # reach it. A bare "6379:6379" would put an unauthenticated Redis on every network the
      # laptop joins, and an unauthenticated Redis reachable from a network is a
      # remote-code-execution primitive, not merely an information leak.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    # Auth.js magic links are useless in development without somewhere for the mail to go.
    # Mailpit accepts anything on 1025 and shows it in a web UI on 8025. Nothing leaves the
    # machine, so no real inbox and no SMTP provider credentials are involved in dev.
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:1025:1025" # SMTP  -> set SMTP_HOST=localhost SMTP_PORT=1025 in .env
      - "127.0.0.1:8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Optional: build and run the real production image against the dev database, to catch
  # standalone-output and runtime-env problems before they reach the VPS.
  # Not started by `docker compose up` — it is behind a profile.
  web-prod:
    profiles: ["prodtest"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${IMAGE_NAME:-app-web}:localtest
    restart: "no"
    logging: *default-logging
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Inside the container, "localhost" is the container. Point at the db service.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-app}
      # Same substitution for Redis: `redis://localhost:6379` in a .env is correct on the
      # host and points the container at ITSELF, where nothing is listening. The cache then
      # silently misses on every read (lib/sources/cache.ts treats a dead cache as a miss),
      # so the map works and is slow and hits upstreams on every request — a failure with
      # no error message anywhere. Overriding it here is what stops that.
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data_dev:
