# Local development stack.
#
# Runs Postgres 16 and an SMTP sink; run the app on the host with `pnpm dev` (bind-mounted
# watchers are slow on macOS/Windows and node_modules would clash).
#
# Quick start:
#   cp .env.example .env      # then fill in the values it tells you to
#   docker compose up -d      # starts db + mailpit
#   pnpm db:migrate && pnpm db:seed
#   pnpm dev                  # http://localhost:3000
#   open http://localhost:8025  # Mailpit: every magic-link email lands here
#
# To smoke-test the *production* image locally before deploying:
#   docker compose --profile prodtest up -d --build web-prod
#   curl -fsS http://localhost:3000/api/health

name: ${COMPOSE_PROJECT_NAME:-app}-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      TZ: ${TZ:-UTC}
    ports:
      # Loopback only, so the dev database isn't exposed to the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER:-app}\" -d \"$${POSTGRES_DB:-app}\" -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    # Catches magic-link mail: SMTP on 1025, web UI on 8025. Nothing leaves the machine.
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:1025:1025" # SMTP  -> set SMTP_HOST=localhost SMTP_PORT=1025 in .env
      - "127.0.0.1:8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Optional: the production image against the dev database (profile-gated).
  web-prod:
    profiles: ["prodtest"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${IMAGE_NAME:-app-web}:localtest
    restart: "no"
    logging: *default-logging
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Inside the container, "localhost" is the container. Point at the db service.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-app}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_dev:
